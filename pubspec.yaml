name: timesheet
description: Local time tracking app for workplaces, projects, and invoices.
publish_to: "none"
version: 1.3.1+11

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  intl: ^0.20.3
  table_calendar: ^3.1.3
  scrollable_positioned_list: ^0.3.8
  fl_chart: ^0.69.2
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^13.3.0
  uuid: ^4.5.1
  package_info_plus: ^10.2.1
  archive: ^4.0.7
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_foreground: assets/icon/app_icon.png
  adaptive_icon_background: "#00000000"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon/app_icon.png
  android_12:
    image: assets/icon/app_icon.png
    color: "#FFFFFF"

flutter:
  uses-material-design: true
